[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pexels-sdk"
dynamic = ["version"]
description = "A Python SDK for the Pexels API — search photos, videos, and browse curated collections."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Pexels SDK Contributors"}
]
keywords = ["pexels", "api", "sdk", "photos", "videos", "stock-photos"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/difyz9/pexels-sdk"
Repository = "https://github.com/difyz9/pexels-sdk"
Issues = "https://github.com/difyz9/pexels-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pexels_sdk*"]

[tool.setuptools.dynamic]
version = {attr = "pexels_sdk.__version__"}
