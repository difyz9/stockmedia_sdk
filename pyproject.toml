[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pexels-sdk-py"
version = "1.0.0"
description = "A Python SDK for the Pexels API — search photos, videos, and browse curated collections."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pexels SDK Contributors"}
]
keywords = ["pexels", "api", "sdk", "photos", "videos", "stock-photos"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/username/pexels-sdk-py"
Repository = "https://github.com/username/pexels-sdk-py"
Issues = "https://github.com/username/pexels-sdk-py/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pexels_sdk*"]
