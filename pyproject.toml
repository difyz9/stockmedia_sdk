[build-system]
requires = ["setuptools>=64.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmedia-sdk"
dynamic = ["version"]
description = "Python SDKs for free stock media APIs — Pexels, Pixabay, and more."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Stockmedia Contributors"}
]
keywords = ["pexels", "pixabay", "stock-photos", "api", "sdk", "photos", "videos"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/difyz9/stockmedia_sdk"
Repository = "https://github.com/difyz9/stockmedia_sdk"
Issues = "https://github.com/difyz9/stockmedia_sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stockmedia_sdk", "stockmedia_sdk.*"]

[tool.setuptools_scm]
